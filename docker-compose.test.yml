# Local/CI testing - includes docker-compose.prod.yml wholesale and swaps
# the real SMTP2GO relay for a throwaway local Mailpit container, so
# outbound mail never leaves the machine.
#
# Usage:
#   docker network create dokploy-network   # one-time, if it doesn't exist yet
#   docker compose -f docker-compose.test.yml up
#
# Then view "sent" mail at http://localhost:8025 - nothing is delivered.
# Grafana is at http://localhost:3000 (admin / GRAFANA_ADMIN_PASSWORD) -
# only published here, not in docker-compose.prod.yml, which relies on
# Dokploy's own domain routing instead.
# See README.md for the full local verification flow.

include:
  - docker-compose.prod.yml

services:
  postfix:
    environment:
      EMAIL_RELAY_HOST: "[mailpit]:1025"
      SMTP_RELAY_USERNAME: test
      SMTP_RELAY_PASSWORD: test
      # Mailpit supports STARTTLS + "accept any" auth by default, but
      # neither is needed for local testing - keep it plain.
      SMTP_SASL_AUTH_ENABLE: "no"
      SMTP_TLS_SECURITY_LEVEL: none
    networks:
      - test
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
    networks:
      - test

  grafana:
    ports:
      - "3000:3000"

networks:
  test:
    driver: bridge
