name: validate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # The dev half must at least be a valid compose file.
  dev:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: compose config
      run: docker compose -f dev/compose.yaml config --quiet
