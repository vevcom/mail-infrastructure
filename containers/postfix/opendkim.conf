# OpenDKIM - only started in DELIVERY_MODE=direct, see entrypoint.sh, which
# also writes KeyTable/SigningTable and generates the key.
#
# Signing only (no verification), and only for mail From our own domain
# that comes from an authenticated client (the website, via SASL) or is
# generated locally (bounces). Forwarded alias mail is left untouched, so
# the original sender's DKIM signature stays valid.

Syslog                  yes
SyslogSuccess           yes
UMask                   007
UserID                  opendkim:opendkim
PidFile                 /run/opendkim/opendkim.pid
Socket                  inet:8891@127.0.0.1

Mode                    s
Canonicalization        relaxed/simple
# Sign the From header one extra time, so nobody can add a second From:
# that a mail client might show instead of ours.
OversignHeaders         From

KeyTable                /etc/opendkim/KeyTable
SigningTable            refile:/etc/opendkim/SigningTable
InternalHosts           127.0.0.1, ::1
