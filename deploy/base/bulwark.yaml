# The webmail. Browsers talk to Stalwart's JMAP api directly, at the address in bulwark-config,
# so Stalwart allows every origin (see plan.ndjson). Its state, the session secret among it, is on
# the volume, so a restart keeps everyone signed in.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: bulwark
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app.kubernetes.io/name: bulwark
    template:
        metadata:
            labels:
                app.kubernetes.io/name: bulwark
        spec:
            # The image runs as this user and the volume has to be writable by it.
            securityContext:
                fsGroup: 1001
            volumes:
                - name: data
                  persistentVolumeClaim:
                      claimName: bulwark-data
            containers:
                - name: bulwark
                  image: ghcr.io/bulwarkmail/webmail:1.19.1
                  env:
                      - name: HOSTNAME
                        value: 0.0.0.0
                      - name: PORT
                        value: "3000"
                  envFrom:
                      - configMapRef:
                            name: bulwark-config
                  ports:
                      - name: http
                        containerPort: 3000
                  volumeMounts:
                      - name: data
                        mountPath: /app/data
                  readinessProbe:
                      httpGet:
                          path: /
                          port: http
                      periodSeconds: 10
                  livenessProbe:
                      httpGet:
                          path: /
                          port: http
                      periodSeconds: 20
                      failureThreshold: 3
                  resources:
                      requests:
                          cpu: 50m
                          memory: 128Mi
                      limits:
                          memory: 512Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: bulwark-data
spec:
    accessModes: [ReadWriteOnce]
    resources:
        requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
    name: bulwark
spec:
    selector:
        app.kubernetes.io/name: bulwark
    ports:
        - name: http
          port: 80
          targetPort: http
