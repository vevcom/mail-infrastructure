name: release

# Publishing a GitHub release builds the images this repo has and pushes them to GHCR under the
# release tag, then opens a pull request on vivat that points its Application for this repo at
# the release. Merging that pull request is the deploy. See README.md.
on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: postfix/containers/postfix
            image: ghcr.io/vevcom/mail-postfix
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: ${{ matrix.context }}
        push: true
        tags: ${{ matrix.image }}:${{ github.event.release.tag_name }}
        cache-from: type=gha,scope=${{ matrix.image }}
        cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # A pre-release only publishes images, for trying by hand.
  bump:
    needs: images
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
    # The default token cannot write to another repo, and GitHub starts no workflows for a pull
    # request made with it, so the checks vivat requires would never report. The deploy app is
    # the one omegaweb-next's release workflow uses, installed on vivat.
    - uses: actions/create-github-app-token@v2
      id: token
      with:
        app-id: ${{ vars.DEPLOY_APP_ID }}
        private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
        owner: vevcom
        repositories: vivat
    - name: checkout vivat
      uses: actions/checkout@v4
      with:
        repository: vevcom/vivat
        token: ${{ steps.token.outputs.token }}
        persist-credentials: false
    - name: point prod at the release
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        files=$(grep -rl 'repoURL: https://github.com/vevcom/mail-infrastructure.git' clusters/prod || true)
        if [ -z "$files" ]; then
          echo "vivat runs nothing from this repo yet, so there is nothing to point at $RELEASE_TAG"
          exit 0
        fi
        for file in $files; do
          sed -i -E \
            -e "s#^([[:space:]]*targetRevision: ).*#\1$RELEASE_TAG#" \
            -e "s#(ghcr\.io/vevcom/mail-[a-z-]+:)[^[:space:]]+#\1$RELEASE_TAG#" \
            "$file"
        done
        git diff
    # Does nothing when the step above changed nothing.
    - uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ steps.token.outputs.token }}
        branch: deploy/mail-${{ github.event.release.tag_name }}
        commit-message: "deploy(mail): ${{ github.event.release.tag_name }} to prod"
        title: "deploy(mail): ${{ github.event.release.tag_name }} to prod"
        body: Merging this deploys ${{ github.event.release.html_url }} through Argo CD.
